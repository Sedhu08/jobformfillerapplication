# ================================
# DATABASE CONFIG
# ================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/jobfiller?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sedhu1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / HIBERNATE CONFIG
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ================================
# APP CONFIG
# ================================
server.port=8081
spring.main.allow-bean-definition-overriding=true

# ================================
# SCREENSHOT CONFIG
# ================================
app.screenshot.path="C:/jobfiller/screenshots_jobapp"

# ================================
# ERROR LOG CONFIG
# ================================
app.errorlog.path="C:/jobfiller/errorlog"

# ================================
# DISABLE WEB SERVER
# (Desktop app - no web server needed)
# ================================
spring.main.web-application-type=servlet

# ================================
# SPRING AI - OLLAMA CONFIG
# ================================
# Ollama must be running locally: ollama serve
spring.ai.ollama.base-url=http://localhost:11434

# Model to use for form filling — change to any model you have pulled
# e.g. llama3, mistral, phi3, gemma2
spring.ai.ollama.chat.model=llama3

# Keep model loaded between requests (faster)
spring.ai.ollama.chat.options.keep-alive=-1

# Temperature: 0 = deterministic JSON, good for structured output
spring.ai.ollama.chat.options.temperature=0.0

# Increase context so large form HTML fits in one prompt
spring.ai.ollama.chat.options.num-ctx=8192